# Copy this file to config.yaml for local development. Do not commit config.yaml.
# Supply deployment credentials through the INKFLOW_* environment variables.
system:
  env: "develop"
  addr: ":8888"
  db-type: "sqlite"
  db-path: "inkflow.db"
  bootstrap-owner-username: ""
  bootstrap-organization: "Default organization"

auth:
  remote-base-url: ""
  remote-timeout-seconds: 15
  session-cookie-name: "inkflow_session"
  session-cookie-secure: false
  session-cookie-same-site: "lax"
  session-ttl-hours: 24
  login-max-failures: 5
  login-lock-minutes: 15
  login-ip-limit: 30
  login-ip-window-seconds: 600
  captcha-ttl-seconds: 300
  mfa-enrollment-required: false
  public-base-url: "http://localhost:8888"
  frontend-base-url: "http://localhost:5173"
  oauth-providers:
    google:
      enabled: false
    github:
      enabled: false

export:
  office-command: ""
  timeout-seconds: 60

concurrency:
  node-id: 0
  requests-per-second: 100
  burst: 100
  cache-entries: 1024

ocr:
  enabled: true
  model-path: ""
  score-threshold: 0.3
  threads: 2

oss:
  endpoint: ""
  bucket: ""
  region: ""
  signed-url-expire: "10m"

llm:
  base-url: ""
  context-size: 4096
  temperature: 0.7
  timeout: 600
  inference-provider: "frontend"
  model-default: ""
  top-p: 0.8
  top-k: 40

rag:
  vector-backend: "usearch"
  vector-path: "./data/inkflow_vectors"
  vector-dimension: 1024
  hnsw-m: 32
  hnsw-ef-construction: 256
  hnsw-ef-search: 64
  embedding-cache-enabled: false
  embedding-cache-path: "./.cache/embedding_cache.sqlite"

pgsql:
  path: "localhost"
  port: "5432"
  config: "sslmode=disable TimeZone=Asia/Shanghai"
  db-name: "inkflow"
  username: "inkflow"
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: "info"

zap:
  level: info
  format: console
  prefix: "[InkFlow]"
  director: log
  show-line: true
  encode-level: LowercaseLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: true
  max-age: 7
